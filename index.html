<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .ocean {
      position: relative;
      overflow: hidden;

      width: 100%;
      height: 100vh;

      background: linear-gradient(to bottom, #37bcec, #075985 55%, #022c43);
    }

    /* 물방울 */
    .bubble {
      position: absolute;
      bottom: -50px;

      width: 25px;
      height: 25px;

      border: 2px solid rgb(255, 255, 255, 0.67);
      border-radius: 50%;

      animation: bubble-up 5s linear infinite;
    }

    .bubble-1 {
      left: 15%;
    }

    .bubble-2 {
      left: 55%;

      width: 15px;
      height: 15px;

      animation-delay: 2s;
    }

    .bubble-3 {
      left: 80%;

      width: 35px;
      height: 35px;

      animation-delay: 3.5s;
    }

    @keyframes bubble-up {
      0% {
        bottom: -50px;
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        bottom: 110%;
        opacity: 0;
        transform: translateX(50px);
      }
    }

    .fish {
      position: absolute;
      top: 45%;
      left: -120px;

      font-size: 80px;

      animation: fish-move 8s linear infinite;
    }

    .fish-2 {
      top: 55%;
      animation-delay: 2s;
    }

    .fish-3 {
      top: 80%;

      animation-delay: 3.5s;
    }

    @keyframes fish-move {
      0% {
        left: calc(100% + 120px);
        top: 50%;
      }

      50% {
        top: 35%;
      }

      100% {
        left: -120px;
        top: 55%;
      }
    }

    .seaweed {
      position: absolute;
      bottom: -20px;

      font-size: 100px;
      transform-origin: bottom;

      animation: seaweed-wave 2s ease-in-out infinite alternate;
    }

    .seaweed-1 {
      left: 12%;
    }

    .seaweed-2 {
      right: 15%;
      animation-delay: 0.7s;
    }

    @keyframes seaweed-wave {
      from {
        transform: rotate(-8deg);
      }

      to {
        transform: rotate(8deg);
      }
    }
  </style>

</head>

<body>
  <div class="ocean">
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>

    <div class="fish fish-1">🐟</div>
    <div class="fish fish-2">🐠</div>
    <div class="fish fish-3">🐡</div>

    <div class="seaweed seaweed-1">🌿</div>
    <div class="seaweed seaweed-2">🥬</div>
  </div>
</body>

</html>
